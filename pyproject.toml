[project]
name = "receipt-automation"
version = "0.1.0"
description = "Fully local receipt to Excel automation pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pillow>=10.0",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
ocr = ["paddleocr[doc-parser]>=3.0", "paddlepaddle>=3.2.1"]
coreml = ["coremltools>=7.2"]
llm = ["llama-cpp-python>=0.2.80"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
receipt-automation = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
